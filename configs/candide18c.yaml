# candide18c.yaml — Pretraining config for Candide 18c historical French LM
# Architecture: 118M params, RoPE + GQA + SwiGLU + RMSNorm
# Corpus: ModERN 18c French, ~2.3B unique tokens, 32k domain BPE tokenizer
# Target: beat D'AlemBERT on FreEM_LPM POS tagging

model:
  vocab_size: 32132          # 32k BPE + 132 special tokens
  d_model: 768
  n_layers: 8
  n_heads: 12
  n_kv_heads: 4              # GQA — reduces KV cache memory
  d_ff: 3072                 # 4 × d_model
  max_seq_len: 1024
  dropout: 0.1
  norm_first: true
  norm_type: rms
  attention_type: gqa
  ffn_type: swiglu
  use_rope: true
  rope_theta: 10000.0
  bias: false
  tie_word_embeddings: false

training:
  max_steps: 20000           # ~1.3B tokens at eff_batch=64, seq=1024
  batch_size: 8
  gradient_accumulation_steps: 8   # effective batch = 64
  learning_rate: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 2000         # 10% of total steps
  min_lr: 3.0e-5             # 10× decay at end of cosine
  mixed_precision: bf16
  eval_every: 100
  eval_steps: 50
  save_every: 2000
  log_every: 10
  seed: 42

data:
  shards_dir: /data/pretrain_candide/shards
  tokenizer_path: /data/pretrain_candide/tokenizer/tokenizer.json
  sequence_length: 1024
  num_workers: 2             # 2 workers good for NFS/mounted volume
  prefetch_factor: 4
  pin_memory: true

logging:
  use_wandb: true           # enable with --wandb flag
  wandb_project: candide-18c
  wandb_entity:          # set to your wandb username
  wandb_run_name: candide18c-118m-modern
  wandb_tags:
    - candide
    - 18c-french
    - historical-lm
    - modern-corpus
    - dalembert-comparison
  output_dir: /data/pretrain_candide/runs/candide18c

# ── Notes ──────────────────────────────────────────────────────────────────
# Estimated training time: ~8-10h on single A40
# Estimated peak VRAM: ~14GB (plenty of headroom on 46GB A40)
# Token budget: 20k steps × 64 eff_batch × 1024 seq = 1.31B tokens
#
# For full 2.3B token run, increase max_steps to ~34000
# For trial run: python train_candide18c.py --config candide18c.yaml --trial
#
# Evaluation targets:
#   - Perplexity on held-out ModERN: target < 40 (D'AlemBERT baseline ~35)
#   - Tokenizer fertility: 1.425 tokens/word (already validated)
#   - POS tagging FreEM_LPM: target > D'AlemBERT F1