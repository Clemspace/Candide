# Candide v2g full run. Every value below is traced in docs/decisions.md (4.5, 4.7, 4.8).
#   Architecture: GPT+ (2.3: clean-validation rescoring of the pilot,
#     results/2026-11-10/rescore_v1f.json).
#   Shape: 29L x 768, 224.3M parameters (4.5; frozen in 4.7). Shape rule: head_dim 64,
#     KV ratio 3, SwiGLU d_ff = 3 d_model, tied embeddings.
#   Optimizer: Muon (4.4, results/2026-11-10/lrcheck_v2g.json), compiled (4.5).
#   Learning rate: 2.4e-3 (4.7: 29L, 500M tokens, results/2026-11-11/depthcheck_29l.json).
#   max_steps: 95,000 x 65,536 = 6.23B tokens, ~2.1 passes over the main corpus. From
#     37.5k tok/s at this shape (results/2026-11-11/bench_a40_causal.json: real-valued RoPE and
#     declared causality), less ~1.5% for evaluation: about 47 h on one A40.
#   keep_steps: about 25/50/75% of max_steps, plus 62,000 and 76,000. 76,000 is the last stable
#     step (the cooldown is the final 20%). 62,000 is where the cooldown of a 77,500-step run
#     would start (5.08B tokens, the 4.5 sizing): a shorter run can be branched from it later
#     with --cooldown-start, to compare 1.75 against 2.1 passes without retraining.
#   Data (4.2 intent kept, shares rescaled to the new token budget in 4.8): stable phase
#     4.98B tokens, cooldown 1.25B. Encyclopédie ~1.1 passes in the stable phase and ~1.2 in the
#     cooldown; canon ~1.0 pass in the cooldown on top of its share of the main corpus.
model:
  arch: gpt
  qk_norm: true
  vocab_size: 32132
  d_model: 768
  n_layers: 29
  n_heads: 12
  n_kv_heads: 4
  d_ff: 2304
  max_seq_len: 1024
  dropout: 0.0
  norm_first: true
  norm_type: rms
  attention_type: gqa
  ffn_type: swiglu
  use_rope: true
  rope_theta: 10000.0
  bias: false
  tie_word_embeddings: true

training:
  max_steps: 95000
  batch_size: 16                   # micro-batch; 32 does not fit at 29L (bench)
  gradient_accumulation_steps: 4   # 64 x 1024 = 65,536 tokens per step
  optimizer: muon
  muon_momentum: 0.95
  muon_ns_steps: 5
  muon_adjust_lr: match_rms
  compile: true
  learning_rate: 2.4e-3
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_steps: 1000
  min_lr: 2.4e-4                # cosine only; unused with wsd
  schedule: wsd
  cooldown_frac: 0.2
  cooldown_shape: 1-sqrt
  final_lr_ratio: 0.0
  mixed_precision: bf16
  eval_every: 2000              # three validation sets per evaluation: ~1.5% of wall-clock
  eval_steps: 50
  save_every: 1000
  keep_last: 2
  keep_steps: [24000, 48000, 62000, 71000, 76000]   # multiples of save_every
  log_every: 10
  seed: 1

data:
  shards_dir: /data/pretrain_candide/shards_v2g     # source "main" + validation
  sources:
    enc: /data/pretrain_candide/shards_enc
    canon: /data/pretrain_candide/shards_canon
  mix: {main: 0.994, enc: 0.006}
  cooldown_mix: {main: 0.90, canon: 0.075, enc: 0.025}
  extra_val:
    enc: /data/pretrain_candide/shards_enc          # held-out volume 17
    canon: /data/pretrain_candide/shards_canon
  sequence_length: 1024
  num_workers: 2
  train_order: global
  val_windows: 1600
  val_seed: 0

logging:
  wandb_project: candide-18c
  wandb_run_name: candide-v2g-224m
  wandb_group: full-v2g
  wandb_tags: [candide, 18c-french, full-run, v2g, gptplus]
  output_dir: ./runs/full/candide-v2g-224m
